<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>배달의민족 세일즈 올인원 가이드</title>
<style>
:root{
  --bg1:#eef7f6; --bg2:#f3f4fb;
  --card:#ffffff; --text:#1c2430; --muted:#667085; --border:#e3e8ee;
  --mint:#2ac1bc; --mint-dk:#0f8480; --mint-ink:#064b48;
  --picker-bg:linear-gradient(135deg,#d6f3f0 0%,#e4ecfb 55%,#efe6fb 100%);
  --picker-bd:rgba(255,255,255,.9);
  --glass-top:rgba(255,255,255,.95); --glass-bot:rgba(255,255,255,.58); --glass-bd:rgba(255,255,255,.9);
  --glass-sh:0 1px 2px rgba(16,40,60,.10),0 8px 18px -8px rgba(16,90,100,.30);
  --on-top:#27b9b4; --on-bot:#0e7f7b;
  --info-bg:#e8f1ff; --info-tx:#1d4f91; --warn-bg:#fff6cf; --warn-tx:#7a5b00;
  --ph-bg:#ffe2bd; --ph-tx:#7a3e00; --ok-bg:#d3f3df; --ok-tx:#0f5a2e;
  --std:#0f8480; --std-bg:#e3f7f6; --std-bd:#a9e3e0;
  --prm:#5b3fd1; --prm-bg:#efeaff; --prm-bd:#cfc3f7;
  --side1:#2ec6c0; --side2:#0f8b87;
  --detail-sh:0 1px 2px rgba(16,40,60,.06),0 18px 40px -18px rgba(16,60,90,.28);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg1:#12181b; --bg2:#15161f;
    --card:#1c2126; --text:#e8eaee; --muted:#9aa3b2; --border:#2f3640;
    --mint:#35cfc9; --mint-dk:#5fe0db; --mint-ink:#d6fffd;
    --picker-bg:linear-gradient(135deg,#17302f 0%,#1a2336 55%,#251d38 100%);
    --picker-bd:rgba(255,255,255,.10);
    --glass-top:rgba(255,255,255,.14); --glass-bot:rgba(255,255,255,.05); --glass-bd:rgba(255,255,255,.16);
    --glass-sh:0 1px 2px rgba(0,0,0,.4),0 8px 18px -8px rgba(0,0,0,.6);
    --info-bg:#182a44; --info-tx:#a9c8f5; --warn-bg:#3a3213; --warn-tx:#f1d98a;
    --ph-bg:#5a3a14; --ph-tx:#ffd9a8; --ok-bg:#14412a; --ok-tx:#a8e8c3;
    --std:#5fe0db; --std-bg:#143532; --std-bd:#266b67;
    --prm:#b9a7ff; --prm-bg:#2a2250; --prm-bd:#4a3d96;
    --side1:#14706d; --side2:#0b4745;
    --detail-sh:0 1px 2px rgba(0,0,0,.4),0 18px 40px -18px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.65}
button{font-family:inherit}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);gap:22px;max-width:1420px;margin:0 auto;padding:18px 22px;min-height:100vh}

/* ───── 사이드바 (민트) ───── */
.side{background:linear-gradient(175deg,var(--side1),var(--side2));color:#fff;padding:26px 18px;
  position:sticky;top:18px;align-self:start;height:calc(100vh - 36px);overflow:auto;border-radius:26px;box-shadow:0 18px 36px -20px rgba(8,80,78,.55)}
.side h1{word-break:keep-all;font-size:17px;line-height:1.45;margin:0 0 18px;font-weight:800;letter-spacing:-.2px;text-shadow:0 1px 2px rgba(0,60,58,.3)}
.nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;
  border:1px solid rgba(255,255,255,.35);border-radius:16px;color:#fff;font:inherit;font-weight:600;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.10));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 10px -4px rgba(0,60,58,.4);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .12s,box-shadow .12s,background .12s}
.nav button:hover{background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.16));transform:translateY(-1px)}
.nav button:active{transform:scale(.98)}
.nav button.on{background:linear-gradient(180deg,#fff,#e9fbfa);color:var(--mint-dk);border-color:#fff;font-weight:800;
  box-shadow:inset 0 1px 0 #fff,0 8px 18px -6px rgba(0,60,58,.55)}
.me{margin-top:24px;padding:16px 14px 14px;border-radius:20px;background:rgba(0,70,68,.28);
  border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.me b{font-size:13px}
.me b span{font-weight:400;opacity:.9}
.me label{display:block;font-size:12px;opacity:.95;margin:12px 0 4px;font-weight:600}
.me input{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,.7);border-radius:12px;
  background:rgba(255,255,255,.94);color:#1c2430;font:inherit;box-shadow:inset 0 1px 2px rgba(0,60,58,.15)}
.me input:focus{outline:3px solid rgba(255,255,255,.55);border-color:#fff}
.me small{display:block;margin-top:12px;opacity:.9;font-size:12px;line-height:1.5}

main{padding:14px 10px 70px;min-width:0}
h2.title{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}

/* ───── 아이폰 느낌 유리 버튼 ───── */
.gbtn{position:relative;border:1px solid var(--glass-bd);color:var(--text);cursor:pointer;font:inherit;
  background:linear-gradient(180deg,var(--glass-top),var(--glass-bot));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(0,0,0,.04),var(--glass-sh);
  backdrop-filter:blur(12px) saturate(1.5);-webkit-backdrop-filter:blur(12px) saturate(1.5);
  transition:transform .12s ease,box-shadow .15s ease,background .15s ease}
.gbtn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(16,40,60,.1),0 14px 24px -10px rgba(16,110,110,.45)}
.gbtn:active{transform:translateY(0) scale(.97)}
.gbtn:focus-visible{outline:3px solid rgba(42,193,188,.5);outline-offset:2px}
.gbtn.on{color:#fff;font-weight:800;text-shadow:0 1px 1px rgba(0,60,58,.35);border-color:rgba(255,255,255,.55);
  background:linear-gradient(180deg,var(--on-top),var(--on-bot));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(0,60,58,.25),0 10px 20px -8px rgba(15,132,128,.75)}
.gbtn.on::after{content:"";position:absolute;left:8%;right:8%;top:2px;height:42%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none}

/* ───── 위쪽 '선택 영역' 과 아래쪽 '내용 영역' 구분 ───── */
.picker{background:var(--picker-bg);border:1px solid var(--picker-bd);border-radius:26px;padding:16px 18px 18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 24px -16px rgba(30,90,110,.4)}
.plabel{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--mint-dk);margin:0 0 10px;text-transform:none}
.plabel::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(42,193,188,.25)}
.picker > * + .plabel{margin-top:18px}
.link{display:flex;justify-content:center;margin:-2px 0}
.link i{display:block;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:12px solid var(--mint);
  filter:drop-shadow(0 3px 3px rgba(15,132,128,.3));margin:-1px 0 -10px;position:relative;z-index:2}
.detail{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:26px;
  padding:28px 24px 24px;margin-top:6px;box-shadow:var(--detail-sh)}
.detail::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--mint),#6fe0db)}
.detail.std::before{background:linear-gradient(90deg,var(--std),#52d3cd)} .detail.prm::before{background:linear-gradient(90deg,#5336c9,#9a80ff)}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.dtag{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:800;color:var(--mint-dk);
  background:#e4f8f6;border:1px solid #b6ebe8;
  background:color-mix(in srgb,var(--mint) 16%,var(--card));border-color:color-mix(in srgb,var(--mint) 45%,var(--card))}
h3.step{font-size:20px;margin:0;white-space:pre-wrap;letter-spacing:-.2px}
.goal{margin:8px 0 12px;white-space:pre-wrap;color:var(--muted)}
.goal b{color:var(--text)}

/* 통화 흐름 단계 버튼 */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sbtn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:999px;font-weight:700;font-size:14px;text-align:left;line-height:1.3;min-height:48px}
.sbtn .no{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  font-size:13px;font-weight:800;color:var(--mint-dk);background:linear-gradient(180deg,#fff,#d7f4f2);
  box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(15,100,100,.3)}
.sbtn.on .no{color:var(--mint-dk);text-shadow:none;background:linear-gradient(180deg,#fff,#dffaf8)}
.sbtn .nm{min-width:0}

/* 반응별 대응 */
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cbtn{padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600}
.search{width:100%;padding:12px 16px;border:1px solid var(--glass-bd);border-radius:999px;background:rgba(255,255,255,.8);color:var(--text);font:inherit;margin:2px 0 0;
  box-shadow:inset 0 1px 3px rgba(16,60,90,.12)}
@media (prefers-color-scheme: dark){.search{background:rgba(255,255,255,.08)}}
.search:focus{outline:3px solid rgba(42,193,188,.45);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px}
.rgroups{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start}
.rgroup{display:flex;flex-direction:column;gap:9px;border-radius:24px;padding:10px 10px 12px;
  background:rgba(127,127,127,.08);background:color-mix(in srgb,var(--c1) 12%,transparent);
  border:2px solid rgba(127,127,127,.3);border-color:color-mix(in srgb,var(--c1) 50%,transparent)}
.rghead{display:flex;align-items:center;gap:8px;padding:2px 4px 0}
.rghead .gp{padding:5px 14px;border-radius:999px;color:#fff;font-weight:800;font-size:14px;
  background:linear-gradient(180deg,var(--c1),var(--c2));text-shadow:0 1px 1px rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 7px -2px rgba(0,0,0,.35)}
.rghead .gp .ge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#fff;margin:0 6px 0 -8px;font-size:13px;vertical-align:middle;text-shadow:none;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.rghead small{margin-left:auto;font-weight:800;font-size:12px;color:var(--muted)}
.rgroup .rbtn.on{background:linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(0,0,0,.18),0 10px 20px -8px var(--c2)}
.rgroup .rbtn.on .rn{color:var(--c2)}
.cbtn .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;
  background:linear-gradient(180deg,var(--on-top),var(--on-bot));box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.cbtn.on .dot{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.rbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:20px;min-height:62px}
.rbtn .rn{flex:none;min-width:46px;text-align:center;padding:5px 0;border-radius:999px;font-size:13px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,var(--c1,#27b9b4),var(--c2,#0e7f7b));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 5px -1px rgba(0,0,0,.25);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.rbtn .rt{min-width:0}
.rbtn b{display:block;font-size:14px;line-height:1.35}
.rbtn span.tg{display:block;font-size:12px;opacity:.75;margin-top:2px;line-height:1.4}
.rbtn.on .rn{background:linear-gradient(180deg,#fff,#dffaf8);color:var(--mint-dk);text-shadow:none}
.rbtn.on span.tg{opacity:.92}
.rbtn.on b,.rbtn.on span.tg{position:relative;z-index:1}
.goto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.goto .rbtn{padding:8px 12px;min-height:46px;border-radius:16px;font-size:13px}
.goto .rbtn b{font-size:13px}
.glabel{margin:18px 0 6px;font-weight:800;font-size:14px}

/* 내용 박스 */
.box{background:linear-gradient(180deg,rgba(42,193,188,.05),rgba(42,193,188,.02));border:1px solid var(--border);border-left:4px solid var(--mint);
  border-radius:16px;padding:15px 18px;margin:12px 0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.box h4{margin:0 0 6px;font-size:14px;white-space:normal;color:var(--mint-dk)}
.callouts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.callout{border-radius:16px;padding:14px 16px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.callout b{display:block;margin-bottom:4px}
.callout.info{background:var(--info-bg);color:var(--info-tx)}
.callout.warn{background:var(--warn-bg);color:var(--warn-tx)}
mark.ph{background:var(--ph-bg);color:var(--ph-tx);border-radius:6px;padding:0 5px}
mark.ph.ok{background:var(--ok-bg);color:var(--ok-tx)}
.copy{float:right;margin:-2px 0 8px 10px;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mint-dk)}
.empty{color:var(--muted);padding:12px 0;grid-column:1/-1}

/* ───── 스타터팩 비교 ───── */
.meta{background:var(--info-bg);color:var(--info-tx);border-radius:16px;padding:12px 16px;white-space:pre-wrap;margin-bottom:16px;font-size:13.5px}
.seg{display:inline-flex;gap:8px;flex-wrap:wrap}
.seg .gbtn{padding:10px 20px;border-radius:999px;font-weight:700}
.seg .gbtn.s-std.on{background:linear-gradient(180deg,#27b9b4,#0e7f7b)}
.seg .gbtn.s-prm.on{background:linear-gradient(180deg,#8a6bff,#5336c9);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(40,20,120,.3),0 10px 20px -8px rgba(83,54,201,.75);text-shadow:0 1px 1px rgba(30,10,100,.4)}
.cmp-head{display:grid;grid-template-columns:150px 1fr 1fr;gap:14px;margin:0 0 12px;position:sticky;top:0;z-index:5;padding-top:2px}
.cmp-head div{padding:12px 16px;border-radius:18px;font-weight:800;font-size:16px;text-align:center;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 20px -10px rgba(0,0,0,.35);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.cmp-head .h-std{background:linear-gradient(180deg,#27b9b4,#0e7f7b)}
.cmp-head .h-prm{background:linear-gradient(180deg,#8a6bff,#5336c9)}
.cmp-head .h-k{background:none;box-shadow:none;color:var(--muted);text-shadow:none;font-size:13px;display:flex;align-items:flex-end;justify-content:center}
.prow{display:grid;grid-template-columns:150px 1fr 1fr;gap:14px;margin:12px 0}
.prow .k{display:flex;align-items:flex-start;gap:8px;font-weight:800;padding:14px 4px 0 2px;line-height:1.35}
.prow .k .ic{font-size:20px;line-height:1.2}
.cell{border-radius:18px;padding:14px 16px;background:var(--card);border:1px solid var(--border);box-shadow:0 1px 2px rgba(16,40,60,.05);overflow-wrap:anywhere;word-break:keep-all}
.cell.std{background:linear-gradient(180deg,var(--std-bg),var(--card) 70%);border-color:var(--std-bd)}
.cell.prm{background:linear-gradient(180deg,var(--prm-bg),var(--card) 70%);border-color:var(--prm-bd)}
.cell.both{grid-column:2 / 4;background:linear-gradient(90deg,var(--std-bg),var(--prm-bg));border-color:var(--border)}
.cell p{margin:0 0 5px}.cell p:last-child{margin-bottom:0}
.cell ul{margin:0 0 5px;padding:0;list-style:none}
.cell li{position:relative;padding-left:15px;margin:3px 0}
.cell li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--mint)}
.cell.prm li::before{background:var(--prm)}
.cell strong{font-weight:800}
.cell.std strong{color:var(--std)} .cell.prm strong{color:var(--prm)}
.cell .note{font-size:12.5px;color:var(--muted)}
.cell .tip{background:var(--warn-bg);color:var(--warn-tx);border-radius:10px;padding:6px 10px;font-weight:700}
.cell .none{color:var(--muted);font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;margin:0 0 6px;
  background:linear-gradient(180deg,#fff,#eee9ff);color:var(--prm);border:1px solid var(--prm-bd);box-shadow:inset 0 1px 0 #fff}
.pill.same{background:linear-gradient(180deg,#fff,#e6f7f6);color:var(--mint-dk);border-color:var(--std-bd)}
@media (prefers-color-scheme: dark){.pill{background:#2a2250}.pill.same{background:#143532}}
.one .prow{grid-template-columns:150px 1fr}
.one .cell.wide{grid-column:2}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .app{padding:0;gap:0;display:block}
  .side{position:static;height:auto;padding:18px 16px;border-radius:0;box-shadow:none}
  .nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{width:auto;margin:0;padding:10px 14px}
  main{padding:20px 14px 50px}
  .steps,.goto{grid-template-columns:1fr 1fr}
  .grid,.callouts,.rgroups{grid-template-columns:1fr}
  .cmp-head{display:none}
  .prow,.one .prow{grid-template-columns:1fr;gap:8px}
  .prow .k{padding:6px 0 0}
  .cell.both,.one .cell.wide{grid-column:auto}
  .cell[data-l]::before{content:attr(data-l);display:block;font-size:12px;font-weight:800;margin-bottom:4px;color:var(--std)}
  .cell.prm[data-l]::before{color:var(--prm)}
}

/* ───── 차분한 버전 공통 (.calm) ───── */
.calm{--picker-bg:#f1f6f6;--picker-bd:var(--border)}
@media (prefers-color-scheme: dark){.calm{--picker-bg:#1a2224}}
.calm .side{background:#129a95;box-shadow:0 10px 24px -16px rgba(8,80,78,.5)}
.calm .side h1{text-shadow:none}
.calm .nav button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:12px}
.calm .nav button:hover{background:rgba(255,255,255,.2);transform:none}
.calm .nav button.on{background:#fff;color:#0c6f6b;box-shadow:0 2px 6px rgba(0,50,48,.25)}
.calm .me{background:rgba(0,60,58,.22);box-shadow:none;border-radius:14px}
.calm .me input{border-radius:10px;box-shadow:none}
.calm .picker{border-radius:18px;box-shadow:none}
.calm .detail{border-radius:18px;box-shadow:0 1px 3px rgba(16,40,60,.08)}
.calm .detail::before{height:4px}
.calm .gbtn{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--card);border:1px solid var(--border);box-shadow:0 1px 2px rgba(16,40,60,.07)}
.calm .gbtn:hover{transform:none;border-color:var(--mint);box-shadow:0 2px 8px rgba(16,40,60,.10)}
.calm .gbtn:active{transform:scale(.99)}
.calm .gbtn.on{color:#fff;text-shadow:none;background:var(--on-bot);border-color:var(--on-bot);box-shadow:0 2px 8px rgba(15,100,96,.30)}
.calm .gbtn.on::after{display:none}
.calm .sbtn,.calm .rbtn{border-radius:12px}
.calm .cbtn,.calm .seg .gbtn{border-radius:10px}
.calm .copy{border-radius:10px}
.calm .sbtn .no{background:#e4f5f4;box-shadow:none}
.calm .sbtn.on .no{background:#fff}
.calm .rbtn .rn{background:var(--c2,var(--on-bot));box-shadow:none;text-shadow:none;border-radius:8px}
.calm .rbtn.on .rn,.calm .rgroup .rbtn.on .rn{background:#fff;color:var(--c2,var(--mint-dk))}
.calm .rgroup .rbtn.on{background:var(--c2);border-color:var(--c2);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.calm .rghead .gp{background:var(--c2);box-shadow:none;text-shadow:none;border-radius:8px;font-size:13.5px}
.calm .search{border-radius:12px;box-shadow:none;background:var(--card);border:1px solid var(--border)}
.calm .box,.calm .callout,.calm .cell,.calm .meta{border-radius:12px}
.calm .box{background:var(--card)}
.calm .cell{box-shadow:none}
.calm .cell.std{background:var(--std-bg)} .calm .cell.prm{background:var(--prm-bg)}
.calm .cell.both{background:linear-gradient(90deg,var(--std-bg),var(--prm-bg))}
.calm .cmp-head div{box-shadow:none;text-shadow:none;border-radius:12px}
.calm .cmp-head .h-std{background:var(--std)} .calm .cmp-head .h-prm{background:var(--prm)}
.calm .cmp-head .h-k{background:none}
.calm .seg .gbtn.s-prm.on{background:var(--prm);border-color:var(--prm);box-shadow:0 2px 8px rgba(83,54,201,.3);text-shadow:none}
.calm .seg .gbtn.s-std.on{background:var(--std);border-color:var(--std)}
.calm .ic{display:none}
.calm .prow .k{padding-top:14px}
.calm .pill{box-shadow:none}
.calm .link i{filter:none}

/* ① 민트 한 가지 색 */
.v-mint .cbtn .dot,.v-list .cbtn .dot{display:none}
.v-mint .rgroup{background:var(--card);border:1px solid var(--border);border-radius:16px}
.v-mint .rghead{border-bottom:1px solid var(--border);padding:2px 4px 8px}
.v-mint .rghead .gp{background:none;color:var(--text);padding:0;font-size:15px}
.v-mint .rghead small{background:#e4f5f4;color:var(--mint-dk);padding:2px 10px;border-radius:999px}
@media (prefers-color-scheme: dark){.v-mint .rghead small{background:#173a39}}

/* ② 차분한 톤다운 컬러 */
.v-muted .rgroup{background:rgba(127,127,127,.06);background:color-mix(in srgb,var(--c1) 9%,var(--card));
  border:1px solid rgba(127,127,127,.3);border-color:color-mix(in srgb,var(--c1) 40%,transparent);border-radius:16px}

/* ③ 담백한 목록형 */
.v-list .rgroups{gap:20px 36px}
.v-list .rgroup{background:none;border:0;padding:0;gap:0;border-radius:0}
.v-list .rghead{border-bottom:2px solid var(--text);padding:0 2px 6px;margin-bottom:2px}
.v-list .rghead .gp{background:none;color:var(--text);padding:0;font-size:15px}
.v-list .rbtn{border:0;border-bottom:1px solid var(--border);border-radius:0;background:none;box-shadow:none;min-height:0;padding:10px 6px}
.v-list .rbtn:hover{background:rgba(42,193,188,.07);border-color:var(--border)}
.v-list .rbtn .rn{background:none;color:var(--mint-dk);min-width:36px;padding:0;text-align:left;font-size:13px}
.v-list .rbtn.on .rn,.v-list .rgroup .rbtn.on .rn{background:none;color:var(--mint-dk)}
.v-list .rgroup .rbtn.on{background:rgba(127,127,127,.1);background:color-mix(in srgb,var(--mint) 14%,transparent);color:var(--text);border:0;border-bottom:1px solid var(--border);border-left:3px solid var(--mint);box-shadow:none}
.v-list .goto .rbtn{border:1px solid var(--border);border-radius:10px}

/* ───── 알록달록 아이폰 느낌 그대로 + 컬러만 톤다운 (.soft) ───── */
@media not (prefers-color-scheme: dark){
  .soft{
    --mint:#4fb5b0; --mint-dk:#2b8782; --on-top:#55b7b2; --on-bot:#2a847f;
    --side1:#55b9b4; --side2:#2f8a86;
    --picker-bg:linear-gradient(135deg,#e2f0ee 0%,#e7ecf5 55%,#eee9f4 100%);
    --info-bg:#eaf0f8; --info-tx:#33557f; --warn-bg:#faf2d8; --warn-tx:#6b5420;
    --ph-bg:#f4dfc4; --ph-tx:#6d4318; --ok-bg:#d9eee0; --ok-tx:#1f5a38;
    --std:#2f8a86; --std-bg:#e8f4f3; --std-bd:#b7d9d6;
    --prm:#6a5aae; --prm-bg:#f0edf8; --prm-bd:#d3cbe9;
    --bg1:#f1f6f5; --bg2:#f4f4f9;
  }
  .soft .seg .gbtn.s-std.on,.soft .cmp-head .h-std{background:linear-gradient(180deg,#4aa8a3,#2b7d79)}
  .soft .seg .gbtn.s-prm.on,.soft .cmp-head .h-prm{background:linear-gradient(180deg,#8576c4,#5d4d9f)}
  .soft .seg .gbtn.s-prm.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(40,30,100,.25),0 10px 20px -8px rgba(93,77,159,.6)}
  .soft .detail::before{background:linear-gradient(90deg,var(--mint),#8ccfcb)}
  .soft .detail.std::before{background:linear-gradient(90deg,#2f8a86,#7cc6c1)}
  .soft .detail.prm::before{background:linear-gradient(90deg,#5d4d9f,#a79bd8)}
  .soft .gbtn.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(20,70,68,.25),0 10px 20px -8px rgba(43,125,121,.6)}
  .soft .cbtn .dot{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
}

/* ───── 슬림 (.slim) : 같은 느낌, 덩치만 줄이기 ───── */

.slim .rbtn{padding:7px 11px;min-height:46px;border-radius:14px;gap:10px}
.slim .rbtn .rn{min-width:40px;padding:3px 0;font-size:12px}
.slim .rbtn b{font-size:13.5px;line-height:1.3}
.slim .rbtn span.tg{font-size:11.5px;margin-top:1px;line-height:1.35}
.slim .goto{gap:6px}

.slim .glabel{margin:14px 0 4px;font-size:13px}
.slim .link i{border-left-width:9px;border-right-width:9px;border-top-width:9px;margin-bottom:-8px}

/* ───── 통화 흐름 ① ③ / 스타터팩 구분점 ───── */
.box.list{white-space:normal}
.box.list p{margin:0 0 5px}
.bl{list-style:none;margin:0 0 4px;padding:0}
.bl li{position:relative;padding-left:18px;margin:5px 0}
.bl li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--mint)}
.bl li.sub{margin-left:18px;font-size:.93em;color:var(--muted)}
.bl li.sub::before{width:6px;height:6px;background:transparent;border:1.5px solid var(--mint);top:.6em}
.rxwrap .rxintro{margin:0 0 10px}

  text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.inlink:hover{background:color-mix(in srgb,var(--mint) 16%,transparent);border-radius:4px}
.rxsec{margin:10px 0 0}
.rxgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 8px}
.rxgrid.one{grid-template-columns:1fr}
.rxrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:7px 12px 7px 9px;min-height:40px;border-radius:14px}

.rxdot{flex:none;width:8px;height:8px;border-radius:50%;background:linear-gradient(180deg,var(--c1),var(--c2))}

  background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.prow .k .ic:empty{display:none}
.cell li.note{font-size:12.5px;color:var(--muted);padding-left:0}
.cell li.note::before{display:none}
.cell li.sub strong.em,.cell.std li.sub strong.em,.cell.prm li.sub strong.em{color:var(--text);font-weight:800}
.cell li.sub{margin-left:16px;font-size:13.5px;color:var(--muted)}
.cell li.sub::before{width:5px;height:5px;top:.66em;background:transparent;border:1.5px solid var(--mint)}
.cell.prm li.sub::before{background:transparent;border-color:var(--prm)}
.cell.both li.sub::before{background:transparent;border:1.5px solid var(--mint)}
.cell li.none{color:var(--muted);font-weight:600}
.cell.both li::before{background:linear-gradient(90deg,var(--mint) 50%,var(--prm) 50%)}
@media (max-width:860px){.rxgrid{grid-template-columns:1fr}}

/* ───── 접기 시안 ───── */
.rgitems{display:flex;flex-direction:column;gap:6px}

.chev.o,.fstep[open]>summary .chev{transform:rotate(45deg)}
.rgroups.acc{grid-template-columns:1fr;gap:8px}

.pbrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

  background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 5px -1px rgba(0,0,0,.25);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.pbt{flex:1;min-width:200px}.pbt b{display:block;font-size:14.5px;line-height:1.35}.pbt .tg{font-size:12px;color:var(--muted)}
.pbbtn{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;font-weight:700;font-size:13.5px}

.foldbar{display:flex;justify-content:flex-end;margin:4px 0 0}
.fbtn{padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--mint-dk)}
.fstep{border:1px solid var(--border);border-left:3px solid var(--mint);border-radius:12px;background:var(--card);margin:9px 0;overflow:hidden}

.fstep .fb{padding:0 14px 12px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.fstep.pt{background:var(--warn-bg);border-color:transparent;border-left-color:#d8b04a}
.fstep.pt summary,.fstep.pt .fb{color:var(--warn-tx)}
@media (max-width:860px){.acc .rgitems{grid-template-columns:1fr}}

/* ───── 반응 선택 버튼을 알약(캡슐) 모양으로 : 카테고리 접기 버전 ───── */

.rgroups.acc .rbtn.on .rn,.rgroups.acc .rgroup .rbtn.on .rn{background:none;color:#fff;box-shadow:none}

.rtray{border-radius:18px;padding:12px 12px 12px;background:rgba(127,127,127,.08);background:color-mix(in srgb,var(--c1) 12%,transparent);
  border:1.5px solid rgba(127,127,127,.3);border-color:color-mix(in srgb,var(--c1) 45%,transparent)}

.ref .rl.af{background:var(--info-tx);color:#fff}

/* 11/2 변경 표시 (스타터팩) */
:root{--chg:#c0392b;--chg-bg:#fdecea;--chg-bd:#f3b9b2;--chg-ring:rgba(192,57,43,.10);--chg-glow:255,76,58}
.chg-h{display:inline-block;margin:4px 0 6px!important;padding:3px 11px;border-radius:999px;background:var(--chg-bg);color:var(--chg);border:1px solid var(--chg-bd);font-weight:800;font-size:12.5px}
.chg-l{display:flex;gap:8px;align-items:baseline;margin:4px 0!important;line-height:1.5}
.chg-l b{flex:none;font-size:11.5px;font-weight:800;padding:1px 9px;border-radius:999px;background:rgba(120,130,140,.18);color:var(--muted)}
.chg-l.aft{color:var(--chg);font-weight:800}
.chg-l.aft b{background:var(--chg);color:#fff}
.chg-l.aft strong{color:inherit}
.chg-l.bef{color:var(--muted)}
.chg-l.bef span{text-decoration:line-through;text-decoration-color:rgba(120,130,140,.7)}
.cell.chg{border-color:#fff;animation:chgNeon 2.2s ease-in-out infinite}
@keyframes chgNeon{
  0%,100%{box-shadow:0 0 0 2px #fff,0 0 5px 2px rgba(var(--chg-glow),.55),0 0 14px 3px rgba(var(--chg-glow),.30),inset 0 0 6px rgba(255,255,255,.65)}
  50%{box-shadow:0 0 0 2px #fff,0 0 10px 4px rgba(var(--chg-glow),.95),0 0 26px 9px rgba(var(--chg-glow),.50),inset 0 0 12px rgba(255,255,255,.95)}
}
@media (prefers-reduced-motion: reduce){.cell.chg{animation:none;box-shadow:0 0 0 2px #fff,0 0 12px 4px rgba(var(--chg-glow),.7)}}
.prow .k{word-break:keep-all;overflow-wrap:anywhere}
/* 말풍선(ⓘ 예외) */
.cell li.hastip{position:relative}
.tipb{position:static;display:inline-block;margin-left:6px;padding:1px 9px;border-radius:999px;border:1px solid var(--info-tx);background:var(--info-bg);color:var(--info-tx);font:inherit;font-size:11.5px;font-weight:800;line-height:1.5;cursor:pointer;vertical-align:baseline;word-break:keep-all}
.tipb:hover,.tipb:focus-visible,.tipb.open{background:var(--info-tx);color:var(--card);outline:none}
.tipbox{display:none;position:absolute;left:12px;right:0;max-width:300px;bottom:calc(100% + 6px);z-index:30;padding:11px 13px;border-radius:14px;background:var(--card);color:var(--text);border:1.5px solid var(--info-tx);box-shadow:0 10px 26px -8px rgba(8,30,50,.45);font-size:12.5px;font-weight:500;line-height:1.6;text-align:left;white-space:normal;cursor:default}
.tipbox b{display:block;margin-bottom:4px;color:var(--info-tx);font-weight:800}
.tipbox::after{content:"";position:absolute;left:18px;bottom:-7px;width:11px;height:11px;background:var(--card);border-right:1.5px solid var(--info-tx);border-bottom:1.5px solid var(--info-tx);transform:rotate(45deg)}
.tipb:hover .tipbox,.tipb:focus-visible .tipbox,.tipb.open .tipbox{display:block}

.prow .k .kt{display:block}
.prow .k .chgb{display:block;margin-top:5px;font-style:normal;font-size:11.5px;font-weight:800;color:var(--chg)}
@media (prefers-color-scheme: dark){
  :root{--chg:#ff9b8f;--chg-bg:rgba(240,112,95,.16);--chg-bd:rgba(240,112,95,.45);--chg-ring:rgba(240,112,95,.14);--chg-glow:255,150,135}
  .chg-l.aft b{color:#2a0f0c}
}

/* 라이트/다크 모드 선택 (왼쪽 바, 내 정보 바로 아래) */
.side{display:flex;flex-direction:column}
.side>*{flex:none}
.modewrap{margin-top:14px;padding-top:0}
.mlabel{font-size:11.5px;font-weight:700;opacity:.8;margin:0 4px 6px}
.mode{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(0,50,48,.32);border:1px solid rgba(255,255,255,.2)}
.mode button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:8px 6px;margin:0;width:auto;
  background:transparent;color:rgba(255,255,255,.88);font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:none;text-shadow:none}
.mode button svg{width:16px;height:16px;flex:none}
.mode button:hover{background:rgba(255,255,255,.14)}
.mode button.on{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.80));color:#0e6e6a;
  box-shadow:inset 0 1px 0 #fff,0 3px 8px -3px rgba(0,50,48,.5)}
.mode button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.slim .modewrap{margin-top:12px}

/* 후속 안내 메시지 (1~7단계와 구분되는 블루 톤: 선택 전에도 항상 다른 색) */
.sbtn.msg{color:var(--info-tx);border-color:rgba(70,125,215,.55);
  background:linear-gradient(180deg,#f1f6ff,#d9e7fc);
  box-shadow:inset 0 1px 0 #fff,0 8px 16px -10px rgba(44,104,196,.55)}
.sbtn.msg .no{color:#fff;background:linear-gradient(180deg,#6aa5f4,#3a74d0);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 3px rgba(40,90,170,.4)}
.sbtn.msg:hover{background:linear-gradient(180deg,#f7faff,#cfe0fb)}
.sbtn.msg.on{--on-top:#5b9bf0;--on-bot:#2c68c4;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(20,50,110,.25),0 10px 20px -8px rgba(44,104,196,.75)}
.sbtn.msg.on,.sbtn.msg.on:hover{color:#fff;background:linear-gradient(180deg,#5b9bf0,#2c68c4);border-color:#2c68c4}
.sbtn.msg.on .no{color:#2c68c4;background:linear-gradient(180deg,#fff,#e4eefc)}
@media (prefers-color-scheme: dark){
  .sbtn.msg{color:#bcd6ff;border-color:rgba(120,170,255,.55);background:linear-gradient(180deg,#223a63,#172845);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
  .sbtn.msg:hover{background:linear-gradient(180deg,#2a4673,#1d3254)}
  .sbtn.msg.on,.sbtn.msg.on:hover{color:#fff;background:linear-gradient(180deg,#4a86dc,#2358b0);border-color:#7fb0ff}
}
.dtag.msg{color:var(--info-tx);background:var(--info-bg);border-color:rgba(70,125,215,.4)}

/* ───── 메뉴 2단 구성 (불가지역 / 스크립트) ───── */
.nav .chev{display:inline-block;flex:none;margin-left:auto;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);opacity:.85;transition:transform .12s}
.nav .chev.open{transform:rotate(45deg);margin-top:-3px}
.subnav{margin:-2px 0 12px 14px;padding-left:10px;border-left:2px solid rgba(255,255,255,.35)}
.nav .subnav button{padding:9px 12px;font-size:13.5px;margin-bottom:6px;border-radius:13px}
.nav>button::before{content:attr(data-n);flex:none;min-width:18px;font-size:11px;font-weight:800;letter-spacing:.3px;font-variant-numeric:tabular-nums;opacity:.7}
.nav>button.on::before{color:var(--mint-dk);opacity:.85}
.nav>button{font-size:13px;letter-spacing:-.3px;gap:6px;padding-left:12px;padding-right:10px;word-break:keep-all;white-space:nowrap}
.nav .subnav button{font-size:13.5px}
.rpbody{margin:0 0 8px}
.rpbody .me{margin:4px 0 0 14px}
.stabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.stabs .gbtn{padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px}
@media (max-width:860px){
  .rpbody{flex-basis:100%;margin:0}
  .rpbody .me{margin:8px 0 0}
  .subnav{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;margin:0;padding:0;border-left:0}
  .nav .subnav button{margin:0}
}

/* ───── 배민1플러스 불가지역 ───── */
.rg-note{border-radius:16px;padding:12px 16px;margin:0 0 14px;font-size:13.5px;background:var(--card);border:1px solid var(--border);line-height:1.65}
.rg-note p{margin:0}.rg-note p+p{margin-top:4px;color:var(--muted);font-size:12.5px}
.rg-bar{display:flex;gap:8px;align-items:center;margin:0 0 14px}
.rg-bar .search{flex:1;margin:0}
.rg-bar .gbtn{flex:none;padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px}
.rg-hit{border-radius:16px;padding:12px 16px;margin:0 0 12px;font-weight:700;font-size:14px}
.rg-hit.bad{background:var(--chg-bg);color:var(--chg);border:1px solid var(--chg-bd)}
.rg-hit.none{background:var(--ok-bg);color:var(--ok-tx);border:1px solid transparent}
.rg-hit small{display:block;margin-top:3px;font-weight:500;font-size:12.5px;opacity:.9}
.rgd{background:var(--card);border:1px solid var(--border);border-radius:18px;margin:0 0 10px;box-shadow:0 1px 2px rgba(16,40,60,.05)}
.rgd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;font-weight:800;border-radius:18px}
.rgd summary::-webkit-details-marker{display:none}
.rgd summary::before{content:"▸";color:var(--mint-dk);font-size:13px;transition:transform .12s}
.rgd[open] summary::before{transform:rotate(90deg)}
.rgd summary:hover{background:rgba(42,193,188,.08)}
.rgd .cnt{margin-left:auto;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--chg-bg);color:var(--chg);border:1px solid var(--chg-bd)}
.rgd .rgbody{padding:2px 16px 14px}
.rgs{margin:10px 0 0}
.rgsn{font-weight:800;font-size:13.5px;margin:0 0 6px}
.rgsn small{font-weight:600;color:var(--muted);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 11px;border-radius:999px;font-size:13px;font-weight:600;background:var(--chg-bg);color:var(--chg);border:1px solid var(--chg-bd);word-break:keep-all}
.rg-res .rgd{border-color:var(--chg-bd)}
mark{background:#ffe27a;color:#1c2430;border-radius:4px;padding:0 1px}

/* ───── 불가지역 지도 ───── */
:root{--map0:#e6ebee;--maplab:rgba(20,30,40,.62);--maplabst:rgba(255,255,255,.75)}
@media (prefers-color-scheme: dark){:root{--map0:#2b3239;--maplab:rgba(255,255,255,.7);--maplabst:rgba(0,0,0,.55)}}
.rgwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start;margin:0 0 14px}
.mapbox{position:relative;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:12px 12px 10px}
.kmap{display:block;width:100%;height:auto;max-height:640px}
.sdg .mp{fill:rgba(var(--chg-glow),var(--a,0));stroke:rgba(var(--chg-glow),var(--a,0));stroke-width:1.8;stroke-linejoin:round;fill-rule:nonzero;cursor:pointer}
@supports (color:color-mix(in srgb,red 50%,blue)){
  .sdg .mp{fill:color-mix(in srgb,rgb(var(--chg-glow)) var(--p,0%),var(--map0));stroke:color-mix(in srgb,rgb(var(--chg-glow)) var(--p,0%),var(--map0))}}
.sdg.z .mp{fill:var(--map0);stroke:var(--map0)}
.sdg:hover,.sdg.hot{filter:brightness(.86) saturate(1.15)}
.ol{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ol.bg{stroke:rgba(10,30,35,.45);stroke-width:4.6}
.ol.sel,.ol.hit{stroke:#6f7a88;stroke-width:2.6;filter:drop-shadow(0 0 2px #6f7a88) drop-shadow(0 0 6px rgba(111,122,136,.9))}
.fl.sel{fill:#6f7a88;stroke:#6f7a88;stroke-width:.9;stroke-linejoin:round;pointer-events:none;animation:flBlink 1s ease-in-out infinite;filter:drop-shadow(0 0 5px rgba(111,122,136,.85))}
@keyframes flBlink{0%,100%{opacity:.95}50%{opacity:.18}}
@media (prefers-color-scheme: dark){.fl.sel{fill:#c3cad3;stroke:#c3cad3;filter:drop-shadow(0 0 5px rgba(195,202,211,.8))}.ol.sel,.ol.hit{stroke:#c3cad3;filter:drop-shadow(0 0 2px #c3cad3) drop-shadow(0 0 6px rgba(195,202,211,.85))}}
@media (prefers-reduced-motion:reduce){.fl.sel{animation:none;opacity:.8}}
.mlab text{font-size:15px;font-weight:800;fill:var(--maplab);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--maplabst);stroke-width:3px;stroke-linejoin:round}
.mtip{display:none;position:absolute;pointer-events:none;z-index:5;background:#1c2430;color:#fff;padding:10px 12px;border-radius:14px;width:max-content;max-width:300px;box-shadow:0 12px 28px -10px rgba(0,0,0,.55);font-size:12.5px;line-height:1.5}
.mtip .th{display:flex;align-items:center;gap:10px;margin-bottom:7px}.mtip .th b{font-size:14px}
.mtip .th span{margin-left:auto;font-size:11.5px;font-weight:800;padding:1px 9px;border-radius:999px;background:#ff6b5a;color:#fff}
.mtip .tg{display:flex;flex-wrap:wrap;gap:4px}
.mtip .tg span{display:inline-flex;gap:5px;align-items:baseline;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:600}
.mtip .tg em{font-style:normal;font-weight:800;color:#ffb3a8}
.mtip .tf{margin-top:8px;font-size:11px;opacity:.7}
.mtip .tz{margin-left:8px;opacity:.85}
.mleg{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 2px;font-size:12px;color:var(--muted)}
.mleg i.grad{display:inline-block;width:120px;height:10px;border-radius:999px;background:linear-gradient(90deg,rgba(var(--chg-glow),.2),rgba(var(--chg-glow),.95))}
@supports (color:color-mix(in srgb,red 50%,blue)){.mleg i.grad{background:linear-gradient(90deg,color-mix(in srgb,rgb(var(--chg-glow)) 20%,var(--map0)),color-mix(in srgb,rgb(var(--chg-glow)) 95%,var(--map0)))}}
.sdlist{display:flex;flex-direction:column;gap:2px}
.sdrow{display:grid;grid-template-columns:110px 1fr 56px 14px;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;border-radius:10px;background:transparent;color:var(--text);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.sdrow:hover{background:rgba(42,193,188,.12)}
.sdrow.on{background:rgba(var(--chg-glow),.14);font-weight:800}
.sdrow .car{width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .12s}
.sdrow.on .car{transform:rotate(45deg)}
.sddet{margin:2px 0 10px 12px;padding:4px 8px 8px 14px;border-left:3px solid var(--chg-bd)}
.sddet[hidden]{display:none}
.sdrow .bar{height:8px;border-radius:999px;background:var(--map0);overflow:hidden}
.sdrow .bar i{display:block;height:100%;border-radius:999px;background:rgb(var(--chg-glow))}
.sdrow b{text-align:right;color:var(--chg)}
.msrc{text-align:center;font-size:11.5px;color:var(--muted);margin-top:4px}
.rgpanel{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:14px 16px;max-height:680px;overflow:auto}
.rgpanel .rgd{margin-bottom:8px}
.rgsel-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:16px}
#rghead{position:sticky;top:-14px;z-index:3;margin:-14px -16px 10px;padding:12px 16px 8px;background:var(--card);border-radius:22px 22px 0 0}
.rgsel-h .cnt{margin-left:auto;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--chg-bg);color:var(--chg);border:1px solid var(--chg-bd)}
.rgsum{margin:0 0 6px;font-size:14px}.rgsum.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.rgsd{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:13px}
.rgsd div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--border);padding:3px 0}
.rgsd b{color:var(--chg)}
.rgclr{margin-left:auto;width:32px;height:32px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.rgclr svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rgclr[hidden]{display:none}
@media (max-width:860px){.rgwrap{grid-template-columns:1fr}.rgpanel{max-height:none}}
</style>







</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <h1>배달의민족 세일즈 올인원 가이드</h1>
    <nav class="nav" id="nav">
      <button type="button" id="nbRegion" data-n="01"><span class="nl">배민1플러스 불가지역</span></button>
      <button type="button" id="nbRp" data-n="02" aria-expanded="true"><span class="nl">RP스크립트</span><span class="chev open"></span></button>
      <div class="rpbody" id="rpbody">
        <div class="subnav" id="subnav"></div>
        <div class="me">
          <b>내 정보 <span>(스크립트에 자동 반영)</span></b>
          <label for="agency">대리점명</label><input id="agency" autocomplete="off">
          <label for="manager">담당자명</label><input id="manager" autocomplete="off">
          <label for="phone">본인 연락처</label><input id="phone" autocomplete="off">
          <small>입력한 내용은 이 화면에서만 쓰이며 저장·전송되지 않습니다. 새로고침하면 사라집니다.</small>
        </div>
      </div>
      <button type="button" id="nbPack" data-n="03"><span class="nl">스타터팩 핵심 정보</span></button>
    </nav>
    <div class="modewrap">
      <div class="mlabel">화면 모드</div>
      <div class="mode" role="group" aria-label="화면 모드">
        <button type="button" data-m="light"></button>
        <button type="button" data-m="dark"></button>
      </div>
    </div>
  </aside>

 (프리미엄) 통합할인(2,000원 이상 설정)도 꺼지 않게 유지해 주세요. 다음 달 초, 셀프서비스 > [지원받기] 버튼을 꼭 눌러주셔야 지원 돼요.\n5. 혜택이 끝난 뒤에도 광고를 켜두시면 그때부터 중개이용료와 광고비는 사장님 부담이에요.\n6. 메뉴와 원산지는 광고 시작 전에 셀프서비스에서 꼭 확인·수정해 주세요.\n\n입점 준비는 보통 2,3일 길게는 1주일정도 소요됩니다. 궁금하신 점은 배달의민족 고객센터(1600-2111) 혹은 해당 번호 [본인 연락처]로 연락 주세요.\n\n[대리점명] [담당자명] 드림", "next": "· 통화 직후 바로 발송", "point": "· 4번은 프리미엄 신청한 사장님에게만 발송하면 됨"}]}, "reactions": {"title": "사장님 반응별 대응", "index": [{"id": "R1", "cat": "💢 강한 거부감", "label": "배달 생각 없어요 (배달 진행 의사 없음)", "tag": "입점비·위약금 0원, 배달은 배민배달이. 놓치던 추가 매출을 만드는 거예요"}, {"id": "R2", "cat": "💢 강한 거부감", "label": "우리 음식(업종)은 배달에 안 맞아요", "tag": "같은 업종 배달 잘하는 매장 많아요. 메뉴 구성만 조정하면 충분해요"}, {"id": "R3", "cat": "💢 강한 거부감", "label": "그냥 안 할래요 / 생각해볼게요", "tag": "진짜 이유부터 끌어내기. 이유가 나오면 그 포인트만 공략"}, {"id": "R4", "cat": "🤔 필요성", "label": "지금도 괜찮아요 (단골 위주)", "tag": "단골만으론 새 손님이 잘 안 늘어요. 홀은 그대로, 창구 하나 더"}, {"id": "R5", "cat": "⏰ 타이밍", "label": "홀 안정되고 나면 / 오픈 초기라 정신없어요", "tag": "루틴 잡히기 전인 지금이 오히려 시간 내기 쉬워요. 최소 세팅으로 시작"}, {"id": "R6", "cat": "⏰ 타이밍", "label": "지금 (통화가) 정신이 없어서요", "tag": "설득하지 말고 재통화 시간만 확정"}, {"id": "R7", "cat": "📱 기존 채널", "label": "쿠팡(다른 앱)으로도 충분해요", "tag": "겹치지 않는 손님층이 있어요. 주문 받는 곳을 하나 더"}, {"id": "R8", "cat": "📄 준비 상황", "label": "메뉴 아직 준비 안 됐어요", "tag": "메뉴판 사진이나 대표 메뉴 2~3가지면 준비 끝. 추후 수정 가능 안내"}, {"id": "R9", "cat": "📄 준비 상황", "label": "사업자등록증 아직이에요", "tag": "등록증 나오는 날에 맞춰 재연락 약속 (구체적으로 잡으면 좋음)"}, {"id": "R10", "cat": "💰 비용 부담", "label": "수수료 떼면 남는 게 있을지", "tag": "첫 14일 중개이용료 지원으로 먼저 체험. 그 뒤엔 매출 구간별 상생요금제"}, {"id": "R11", "cat": "💰 비용 부담", "label": "월세·고정비 부담돼요", "tag": "고정비는 어차피 나가요. 배달은 그 위에 얹히는 여윳돈"}, {"id": "R12", "cat": "↩️ 과거 경험", "label": "예전에 해봤는데 효과 없었어요", "tag": "정률제로 바뀌어 지금은 여러 가게가 고루 노출돼요"}, {"id": "R13", "cat": "↩️ 과거 경험", "label": "예전에 해봤는데 너무 힘들었어요 (운영·포장)", "tag": "힘들었던 부분을 물어보고, 지금 개선된 점과 용기 구매 방법으로 답변"}], "cards": {"R1": {"header": "사장님 : “배달 생각 없어요” / “배달은 할 생각이 없어요”   ·  💢 강한 거부감", "steps": [["① 공감·질문", "네, 배달까지 하시려면 신경 쓸 게 많으시죠. 혹시 배달 기사 구하는 거나 포장 용기 같은 게 걱정되세요?"], ["② 답변", "그 부분은 배민배달이 맡아드려요. 배달 기사는 배민이 연결해드려서 사장님은 음식만 준비하시면 돼요. 입점 비용도 없고, 중간에 그만두셔도 해지비나 위약금이 없어서 편하게 보시고 판단하시면 돼요.\n요즘에는 뭐 먹을지 고민될 때 일단 배민앱부터 들어가 보시는 분들이 정말 많은데, 그 손님들은 지금 사장님 가게를 볼 수가 없는 상태예요. 홀 매출을 나누는 게 아니라, 놓치던 추가 매출을 새로 만드는 거예요."], ["③ 재확인", "배달은 직접 안 하셔도 되고 부담 없이 시작하실 수 있는데, 한번 해보시고 판단하시는 건 어떠세요?"], ["④ 그래도 거절하면", "네, 그럼 무리하게 권하진 않을게요. \n혹시 나중에 배달 생각 드시면 그때 편하게 연락 주세요."], ["💡 포인트", "· 입점 허들부터 제거 : 입점 비용 0원, 해지 위약금 0원\n· ‘홀 매출을 나누는 게 아니라 놓치던 추가 매출을 만드는 것’\n· 주방·직원 부담 → 영업시간을 한가한 시간대 위주로, 대표 메뉴 2~3가지"]]}, "R2": {"header": "사장님 : “우리 음식은 배달하면 맛이 변해서 안 돼요” / “우리 업종은 배달이 안 맞아요”   ·  💢 강한 거부감", "steps": [["① 공감·질문", "맞아요, 그 말씀 충분히 이해돼요. 따뜻할 때 바로 드셔야 맛있는 메뉴시죠?"], ["② 답변", "사장님, 이 업종으로 배달 운영 잘하고 계신 매장들 정말 많아요.\n요즘은 포장 방식도 잘 나와 있어서, 면 요리는 면과 육수를 따로 담으면 민원이 거의 없고, 보온·보냉 용기나 소스를 따로 담는 방식도 많이 쓰세요."], ["③ 재확인", "그럼 배달에 자신 있는 메뉴 2~3가지만 골라서 먼저 시작해보실래요?"], ["④ 그래도 거절하면", "네, 알겠습니다. 혹시 배달해볼 만한 메뉴 생기시면 그때 편하게 연락 주세요."], ["💡 포인트", "· 포장 방식으로 안심시키기 (면·육수 분리, 보온·보냉 용기)\n· ‘메뉴 구성은 사장님 재량’, ‘다들 안 올리는 메뉴일수록 경쟁이 적어 눈에 띈다’ 는 점을 강조\n· 용기 구매가 부담이면 → R13 (배민상회)"]]}, "R3": {"header": "사장님 : “그냥 안 할래요” / “생각해볼게요” (이유를 말하지 않음)   ·  💢 강한 거부감", "steps": [["① 공감·질문", "네, 알겠습니다. 혹시 어떤 부분이 제일 마음에 걸리시는지 여쭤봐도 될까요? 수수료 걱정이신지, 배달 운영이 걱정이신지요."], ["② 답변", "말씀해주시는 부분에 맞춰서 그 부분만 설명드릴게요.\n▶ 준비가 부담되시면 : 저희가 준비를 도와드리는 매니저라서, 저랑 같이 상의하시면서 한번 준비해 보시면 돼요.\n▶ 손님 반응이 걱정되시면 : 안 좋은 반응보다 좋은 반응 보여주시는 손님들을 단골로 만드는 게 장사잖아요. 오픈하셔서 의욕 있으실 때 알려두시는 게 결국 제일 잘했다고 느끼실 거예요.\n▶ 리뷰가 걱정되시면 : 사장님 음식에 자신 있으시잖아요. 손님들이 드셔봐야 알죠. 혜택이 가장 크게 나오는 처음 시작할 때 같이 해보시고, 혹시 반응이 안 좋으면 그때 판단하셔도 늦지 않아요."], ["③ 재확인", "그럼 그 부분만 해결되면 한번 해볼 만하실까요?"], ["④ 그래도 거절하면", "네, 알겠습니다. 혹시 생각 정리되시면 그때 편하게 연락 주세요."], ["💡 포인트", "· 거부 이유 파악이 최우선 — 진짜 이유를 먼저 끌어내기\n· 이유를 말씀하시면 그 포인트만 집중 공략 (수수료 → R10 / 배달 운영 → R1 / 메뉴 → R2 / 준비 → R8)\n· 예전에 해봤던 사장님이면 ‘그때 어떤 부분이 가장 안 맞으셨는지’부터 (→ R12, R13)"]]}, "R4": {"header": "사장님 : “지금도 괜찮아요” / “단골 위주라 굳이…”   ·  🤔 필요성", "steps": [["① 공감·질문", "다행이에요, 장사가 잘되고 계신다니 좋네요. 혹시 손님들은 주로 단골이세요, 아니면 지나가다 들어오시는 분들이 많으세요?"], ["② 답변", "단골이 탄탄하시면 매출은 안정적이시겠지만, 반대로 새 손님이 늘어날 여지는 크지 않다는 뜻이기도 해요. \n배민은 아직 사장님 가게를 모르는 동네 손님들을 만나는 창구라고 보시면 돼요.\n요즘에는 뭐 먹을지 고민될 때 일단 배민앱부터 들어가 보시는 분들이 정말 많은데, 동네 분들도 마찬가지일 거거든요.\n홀은 지금처럼 하시고, 한가한 시간에 앱으로 들어오는 주문을 추가로 받으신다고 보시면 돼요."], ["③ 재확인", "새 손님 받는 창구를 하나 열어둔다고 생각하시면 어떠세요?"], ["④ 그래도 거절하면", "네, 알겠습니다. \n이 혜택은 처음 시작하실 때 한 번만 받으실 수 있는 거라, 혹시 생각 바뀌시면 그때 꼭 연락 주세요."], ["💡 포인트", "· 바로 반박하지 말고, 손님 구성(단골 vs 신규)을 물어서 ‘신규 유입의 한계’ 공략\n· 홀은 그대로, 추가 매출 관점으로 전환\n· 수수료 걱정 → R10 / 되돌리기 걱정 → 메뉴·영업시간은 언제든 조절 가능"]]}, "R5": {"header": "사장님 : “홀 안정되고 나면 하려구요” / “오픈 초기라 정신없어요”   ·  ⏰ 타이밍", "steps": [["① 공감·질문", "맞아요, 오픈 초기엔 신경 쓸 게 한두 가지가 아니시죠. 오픈하신 지는 얼마나 되셨어요?"], ["② 답변", "그런데 사장님, 오히려 지금이 시간 내기는 더 쉬울 때예요. 홀 손님 루틴이 자리 잡기 전이라 시간을 유연하게 쓰실 수 있는데, 단골 루틴이 잡히고 나면 배달 세팅할 여유가 더 안 나오더라고요.\n그리고 오픈 초기에 동네 손님들께 가게를 알리는 데 배민이 도움이 많이 돼요. 앱에서 보고 홀로 찾아오시는 분들도 있고요. 그래서 우리가게클릭이 같이 들어가 있어요."], ["③ 재확인", "스타터팩 혜택은 처음 시작하실 때 한 번만 받으실 수 있는 거라, 오픈 초기에 같이 쓰시면 가게 알리는 데 도움이 돼요. 첫 14일 중개이용료 지원이랑 우리가게클릭 광고비 지원(월 예산 30만원 이상 설정 시 50%, 최대 15만원)을 받으면서 시작하실 수 있어요."], ["④ 그래도 거절하면", "네, 그럼 언제쯤 여유 생기실 것 같으세요? 그때 맞춰서 다시 한 번 연락드릴게요.\n→ 재연락 날짜 확정"], ["💡 포인트", "· ‘정신없다’는 거절이라기보다 우선순위 문제인 경우가 많음\n· 루틴이 안 잡힌 지금이 오히려 시간 내기 쉬움\n· 진입장벽 낮추기 : 대표 메뉴 2~3가지, 메뉴 사진은 배민 보유 이미지로 최소 세팅\n· 서류만 주시면 전자계약서는 담당자가 작성해서 발송\n· 주방 부담 걱정 → 영업시간 설정을 홀이 한가한 시간대 위주로 (광고를 끄는 것 X)"]]}, "R6": {"header": "사장님 : “지금 정신이 없어서요” (통화 자체가 어려움)   ·  ⏰ 타이밍", "steps": [["① 공감·질문", "아이고, 바쁘신데 죄송해요. 그럼 [오늘 오후 ㅇㅇ시 / 내일 오전] 중에 언제 다시 연락드릴까요?"], ["② 답변", "그때 1분이면 되니까 짧게 말씀드릴게요."], ["③ 재확인", "재통화 시간 확정 후 종료"], ["④ 그래도 거절하면", "네, 알겠습니다. 바쁘신데 전화 받아주셔서 감사합니다."], ["💡 포인트", "· 설득하지 말고 재통화 시간 확정\n· 오픈 초기라 바쁘다는 뜻이면 R5로"]]}, "R7": {"header": "사장님 : “쿠팡으로도 충분해요” / “이미 다른 배달앱 쓰고 있어요”   ·  📱 기존 채널", "steps": [["① 공감·질문", "쿠팡이츠 쓰고 계시는구나, 이미 배달을 해보셨으니 시작하시기 훨씬 수월하시겠어요. 거기서 주문은 어느 정도 들어오세요?"], ["② 답변", "배달앱마다 주로 쓰는 손님층이 좀 달라요. 배민앱만 쓰시는 손님들도 꽤 계셔서, 배민에 가게가 없으면 그분들은 사장님 가게를 아예 못 보시는 거에요.\n쿠팡은 그대로 두시고 주문 받는 곳을 하나 더 늘린다고 보시면 돼요. 쿠팡 이용중이시니 포장이나 라이더 응대는 이미 익숙하실테고, 메뉴도 지금이랑 똑같이 쓰시면 돼요."], ["③ 재확인", "두 군데에서 같이 받으시면 어떨지 한번 해보실래요? 지금 시작하시면 스타터팩 혜택으로 초반 부담 없이 배민 손님 반응부터 보실 수 있어요."], ["④ 그래도 거절하면", "네, 지금 바로 정하시진 않으셔도 돼요. 혹시 쿠팡이랑 같이 쓰실 생각 드시면 그때 편하게 연락 주세요."], ["💡 포인트", "· ‘배민이 더 낫다’ 비교 X → ‘겹치지 않는 손님층이 있다’로 안내\n· 관리가 번거롭다고 하면 → 기존 채널 셋팅 그대로 하시되, 채널만 하나 추가되는 것임을 강조"]]}, "R8": {"header": "사장님 : “메뉴 아직 준비 안 됐어요”   ·  📄 준비 상황", "steps": [["① 공감·질문", "아, 오픈 준비하시느라 정신없으시죠. 혹시 대표 메뉴 몇 개는 정해지셨어요? 오픈은 언제쯤 예정이세요?"], ["② 답변", "메뉴판 사진만 보내주시면 바로 준비해드릴 수 있어요. 메뉴판이 아직 없으시면 대표 메뉴, 주력 메뉴 2~3가지만 말씀해주셔도 일단 광고 준비는 돼요. 라이브 전에 사장님이 셀프서비스에서 직접 수정하시면 되고요.\n메뉴랑 원산지는 손님이 제일 먼저 보는 중요한 정보라, 시작 전에 꼭 한 번 확인해 주세요."], ["③ 재확인", "그럼 메뉴판 사진이나 대표 메뉴 2~3가지만 알려주시면, 신청이랑 시작일은 오픈 날짜에 맞춰 먼저 잡아둘까요?"], ["④ 그래도 거절하면", "네, 그럼 메뉴 정리되실 즈음에 다시 연락드릴게요. 언제쯤이면 괜찮으세요?\n→ 재연락 날짜 확정 (오픈 예정일 메모)"], ["💡 포인트", "· 메뉴판 사진만 있으면 바로 준비 가능\n· 메뉴판이 없으면 대표·주력 메뉴 2~3가지로 광고 준비 → 라이브 전 사장님이 셀프서비스로 직접 수정\n· 사진은 배민 보유 이미지 사용 가능\n· 원산지도 라이브 전에 반드시 정확히 입력하도록 안내"]]}, "R9": {"header": "사장님 : “아직 사업자등록증도 안 나왔어요”   ·  📄 준비 상황", "steps": [["① 공감·질문", "아, 아직 준비 중이시구나. 오픈 준비하시느라 바쁘시겠어요. 혹시 사업자등록증은 언제쯤 나올 예정이세요?"], ["② 답변", "등록증 나오면 바로 신청하실 수 있게 제가 그때 맞춰서 다시 연락드릴게요. 이 혜택은 처음 시작하시는 사장님들을 위한 거라, 등록증 나오고 시작하셔도 받으실 수 있어요.\n그 사이에 대표 메뉴랑 가게 사진 정도만 미리 준비해두시면 등록증 나오자마자 바로 진행하실 수 있어요."], ["③ 재확인", "그럼 등록증 나오는 날 즈음에 다시 한 번 연락드려도 될까요?"], ["④ 그래도 거절하면", "네, 등록증 나오면 편하게 연락 주셔도 되고요, 저도 그 때 맞추어서 한 번 연락드릴게요.\n→ 재연락 날짜 확정 (등록증 발급 예정일 메모)"], ["💡 포인트", "· 사업자등록증이 있어야 계약서 작성 가능 → 등록증 전에는 계약 진행 불가\n· 거절이 아니라 ‘아직’ 상황 → 재컨택 약속이 목표\n· 등록증 발급 예정일과 오픈 예정일 메모\n· 그사이 준비할 것(메뉴·사진)을 알려주면 다음 통화가 쉬워짐"]]}, "R10": {"header": "사장님 : “수수료 떼면 남는 게 있을지 모르겠어요”   ·  💰 비용 부담", "steps": [["① 공감·질문", "맞아요, 배민 입점 말씀드리면 다들 제일 먼저 걱정하시는 게 수수료예요. 혹시 어떤 부분이 제일 마음에 걸리세요?"], ["② 답변", "그래서 처음 시작하시는 사장님들께 스타터팩이라는 지원 프로그램을 운영하고 있어요. 배민배달·픽업 광고 시작하시고 2주 동안 중개이용료를 서울은 50%, 서울 외 지역은 100% 지원해드리고, 우리가게클릭은 월 예산을 30만원 이상으로 설정하시면 30일 동안 광고비의 50%를 최대 15만원까지 지원해드려요.\n그 기간 동안 주문이 얼마나 들어오는지, 배달로 남는 게 있는지 직접 보고 판단하실 수 있어요."], ["③ 재확인", "지금 큰 결정을 하시라는 게 아니라, 부담 없이 먼저 경험해보시는 거예요. 한번 해보실래요?"], ["④ 그래도 거절하면", "네, 알겠습니다. 혹시 수수료 구조가 더 궁금하시면 그때 편하게 연락 주세요."], ["💡 포인트", "· ‘부담 없이 먼저 체험’ 할 수 있다는 내용으로 강조\n· 혜택 끝난 뒤가 걱정이면 → 상생요금제 : 매출 구간별 요율 (상위 35% 7.8% / 중위 6.8% / 하위 20% 2.0%), 신규 매장은 낮은 구간일 수 있음. 2028/02/25까지 운영"]]}, "R11": {"header": "사장님 : “월세에 나가는 게 많은데 배달까지 하면 더 빠듯해요”   ·  💰 비용 부담", "steps": [["① 공감·질문", "매달 임대료만 해도 부담이 크실 텐데, 배달까지 하면 돈이 더 들어갈까 봐 걱정되시는 거죠?"], ["② 답변", "그 마음 충분히 이해돼요. 그런데 임대료나 관리비 같은 고정비는 배달을 하든 안 하든 매달 똑같이 나가잖아요. 배달을 추가한다고 그 고정비가 늘어나진 않아요. 가입비나 월정액 같은 고정비도 따로 없고요.\n지금 인원 그대로, 홀 손님 받으시던 여력 안에서 주문 몇 건 더 받는 구조라 한가한 시간에 받으시는 거라 부담이 적어요. 이미 나가는 돈 위에 여윳돈을 더 만든다고 생각해보세요."], ["③ 재확인", "딱 필요한 만큼만 최소로 시작해보시고, 여윳돈이 실제로 생기는지 한번 확인해보시죠."], ["④ 그래도 거절하면", "네, 알겠습니다. 혹시 생각 바뀌시면 그때 편하게 연락 주세요."], ["💡 포인트", "· 현재 인원으로 충분히 가능한 점을 강조\n· ‘직원 월급 한 번 더’, ‘가족 외식비’처럼 크게 와닿을 수 있는 내용으로 소구\n· 수수료 걱정이 이어지면 R10(상생요금제)과 이어 붙이기"]]}, "R12": {"header": "사장님 : “예전에 배민 해봤는데 돈만 나가고 주문이 없었어요”   ·  ↩️ 과거 경험", "steps": [["① 공감·질문", "매출 효과를 못 보셔서 실망이 정말 크셨겠네요. 혹시 그때 어떤 방식으로 운영하셨는지 여쭤봐도 될까요?"], ["② 답변", "예전에는 광고비를 많이 쓰는 매장이 주문을 가져가는 구조였다면, 지금은 정률제로 바뀌면서 여러 사장님들이 고루 매출을 올리고 계세요. 월 고정비나 입점 비용이 전혀 없고 중도 해지비나 위약금도 없습니다."], ["③ 재확인", "이번엔 혜택 받으면서 부담 없이 다시 한 번 해보시는 거 어떠세요?"], ["④ 그래도 거절하면", "네, 알겠습니다. 혹시 다시 해보실 생각 드시면 그때 편하게 연락 주세요."], ["💡 포인트", "· 실망을 먼저 받아주고, 그때 어떻게 운영했는지 묻기 (공감하기)\n· ‘깃발 꽂았는데 주문 없었다’ → 지금은 깃발 도배에 밀려 노출이 안 되는 구조가 아님 (정률제)\n· 재가입도 과거 스타터팩 혜택 이력이 없고 최근 7일 광고 이력이 없으면 대상 (전자계약서에서 확인)\n· 효과보다 운영이 힘들었던 경험이면 → R13"], ["📌 참고", "■ 광고 방식 변경\n ·  변경 전 : 정액제(울트라콜) - 깃발 1개당 월 8만원(VAT 별도), 주문 유무와 관계없이 매달 고정 부과\n ·  변경 후 : 정률제(배민1플러스) - 월 고정 광고비 없이, 주문이 발생한 건에만 중개수수료 부과\n ·  활용 : ‘깃발 수로 노출 경쟁하던 구조’ → ‘주문이 생길 때만 비용이 나가는 구조’로 설명\n수수료율은 매출 구간별로 다름 → R10 참고"]]}, "R13": {"header": "사장님 : “예전에 해봤는데 너무 힘들었어요” (배차·고객센터·포장 등 운영 피로)   ·  ↩️ 과거 경험", "steps": [["① 공감·질문", "예전에 운영하시면서 많이 힘드셨군요. 혹시 어떤 부분이 제일 힘드셨는지 여쭤봐도 될까요? 배차 지연이나 고객센터 응대, 포장 용기 같은 부분이셨을까요?"], ["② 답변", "그 부분은 지금 많이 개선됐어요. 배차 시간도 라이더 충원으로 크게 단축됐고, 고객센터도 빠르게 연결돼요.\n포장 용기 때문에 번거로우셨다면, 배민상회에서 메뉴에 맞는 용기를 한 번에 보고 사실 수 있고요. \n그리고 라이브 전까지는 제가 사장님 매장을 계속 챙기는 담당자라, 문제가 생기면 관련     if(FILL.hasOwnProperty(k)){var v=val(FILL[k]);
      return v?'<mark class="ph ok">'+esc(v)+'</mark>':'<mark class="ph">['+k+']</mark>';}
    if(MANUAL.indexOf(k)>=0) return '<mark class="ph">['+k+']</mark>';
    return m;});
}
function refHtml(s){
  var h="";
  String(s).split("\n").forEach(function(l){
    l=l.trim(); if(!l) return;
    var m=l.match(/^[·•\s]*(변경 전|변경 후|활용)\s*[:：]?\s*(.*)$/);
    if(l.indexOf("■")===0) h+='<div class="rt">'+esc(l.replace(/^■\s*/,""))+'</div>';
    else if(m) h+='<div class="rr"><span class="rl '+(m[1]==="변경 전"?"bf":m[1]==="변경 후"?"af":"us")+'">'+m[1]+'</span><span class="rb">'+rich(m[2])+'</span></div>';
    else h+='<div class="rn">'+rich(l)+'</div>';
  });
  return h;
}
function plain(s){
  return String(s).replace(/\[([^\[\]\n]+)\]/g,function(m,k){
    if(FILL.hasOwnProperty(k)){var v=val(FILL[k]); return v||m;} return m;});
}
function copy(text,btn){
  function done(){var o=btn.textContent;btn.textContent="복사됨 ✓";setTimeout(function(){btn.textContent=o;},1500);}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,fallback);}else{fallback();}
  function fallback(){var t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";
    document.body.appendChild(t);t.select();try{document.execCommand("copy");done();}catch(e){}t.remove();}
}

/* 통화 흐름 ① : 구분점(민트 동그라미) 목록 */
function bulletHtml(t){
  var out="",ul=false,m;
  String(t).split("\n").forEach(function(raw){
    var l=raw.trim(); if(!l) return;
    if((m=l.match(/^[·•]\s*(.*)$/))){ if(!ul){out+='<ul class="bl">';ul=true;} out+='<li>'+rich(m[1])+'</li>'; return;}
    if((m=l.match(/^└\s*(.*)$/))){ if(!ul){out+='<ul class="bl">';ul=true;} out+='<li class="sub">'+rich(m[1])+'</li>'; return;}
    if(ul){out+='</ul>';ul=false;} out+='<p>'+rich(l)+'</p>';});
  if(ul) out+='</ul>'; return out;
}
/* 통화 흐름 ③ : 부정반응 / 긍정반응 구분 + 클릭 이동 */
function stepIndexByMark(mark){
  for(var i=0;i<D.flow.steps.length;i++){ if(D.flow.steps[i].name.trim().charAt(0)===mark) return i; }
  return -1;
}
function reactHtml(t){
  var intro=[], secs=[], cur=null;
  String(t).split("\n").forEach(function(raw){
    var l=raw.trim(); if(!l) return;
    var m=l.match(/^\[(.+)\]$/);
    if(m){cur={name:m[1],items:[]};secs.push(cur);return;}
    if(!cur){intro.push(l);return;}
    var im=l.match(/^[·•]\s*(.*)$/), body=im?im[1]:l, parts=body.split(/\s*→\s*/);
    cur.items.push({text:parts[0],to:(parts[1]||"").trim()});
  });
  var h="";
  if(intro.length) h+='<div class="rxintro">'+intro.map(function(l){
    return '<p>'+esc(E(l)).replace(/(?:🧐\s*)?반응별 대응 시트탭/,'<button type="button" class="inlink" data-go="react">$&</button>')+'</p>';}).join("")+'</div>';
  secs.forEach(function(sec){
    var neg=sec.name.indexOf("부정")>=0, c=neg?SOFTCOL[0]:SOFTCOL[2];
    var ids=sec.items.map(function(x){return x.to;}).filter(function(x){return /^R\d+$/.test(x);});
    var small=ids.length?ids[0]+' ~ '+ids[ids.length-1]:(sec.items[0]&&sec.items[0].to?'클릭하면 이동':'');
    h+='<div class="rgroup rxsec" style="--c1:'+c[0]+';--c2:'+c[1]+'"><div class="rghead"><span class="gp">'+esc(sec.name)+'</span><small>'+esc(small)+'</small></div>'+
       '<div class="rxgrid'+(neg?"":" one")+'">'+sec.items.map(function(it){
         var chip=it.to?'<span class="rxchip">'+esc(it.to)+'</span>':'';
         return '<button type="button" class="gbtn rxrow" '+(it.to?'data-to="'+esc(it.to)+'"':'disabled')+'>'+chip+'<span class="rxt">'+esc(it.text)+'</span></button>';}).join("")+'</div></div>';
  });
  return h;
}

/* ───── 통화 흐름 ───── */
function stepParts(name){
  var n=one(name), m=n.match(/^([①②③④⑤⑥⑦⑧⑨])\s*(.*)$/);
  if(m) return {no:"①②③④⑤⑥⑦⑧⑨".indexOf(m[1])+1, nm:m[2]};
  return {no:"", ic:n.slice(0,2), nm:n.replace(/^\S+\s*/,"")};
}

  h+='<div class="picker"><div class="plabel">통화 단계 선택</div><div class="steps">'+f.steps.map(function(s,i){

  }
  if(st.next||st.point){
    h+='<div class="callouts">'+
      (st.next?'<div class="callout info"><b>'+E('➡️ 다음 단계')+'</b>'+rich(st.next)+'</div>':'<div></div>')+

function drawReact(){
  var r=D.reactions, f=FOLD, q=S.rq.trim().toLowerCase();
  var shown=r.index.filter(function(x){
    return (f==="1"?(q||x.cat===S.rcat):(S.rcat==="전체"||x.cat===S.rcat))&&(!q||(x.label+x.tag).toLowerCase().indexOf(q)>=0);})
    .sort(function(a,b){return parseInt(a.id.slice(1),10)-parseInt(b.id.slice(1),10);});
  if(shown.length&&!shown.some(function(x){return x.id===S.rsel;})) S.rsel=shown[0].id;
  if($("rgrid")&&f==="1"){
    var tc=q?["#6fb0ac","#45827f"]:catColor(S.rcat);
    $("rgrid").innerHTML=shown.length?'<div class="rtray" style="--c1:'+tc[0]+';--c2:'+tc[1]+'"><div class="rgitems">'+shown.map(function(x){
      var c=catColor(x.cat);
      return '<button class="gbtn rbtn'+(x.id===S.rsel?" on":"")+'" data-r="'+x.id+'" title="'+esc(x.tag)+'" style="--c1:'+c[0]+';--c2:'+c[1]+'"><span class="rn">'+x.id+'</span><span class="rt"><b>'+esc(x.label)+'</b></span></button>';}).join("")+'</div></div>'
      :'<div class="empty">조건에 맞는 반응이 없습니다.</div>';
    Array.prototype.forEach.call($("rgrid").querySelectorAll(".rbtn"),function(b){
      b.onclick=function(){S.rsel=b.getAttribute("data-r");drawReact();};});
    if($("rcats")) Array.prototype.forEach.call($("rcats").querySelectorAll(".cbtn[data-c]"),function(b){

    var groups=[];
    shown.forEach(function(x){var g=groups.filter(function(g){return g.cat===x.cat;})[0];
      if(!g){g={cat:x.cat,items:[]};groups.push(g);} g.items.push(x);});
    $("rgrid").innerHTML=groups.length?groups.map(function(g){
      var c=catColor(g.cat), a=g.items[0].id, l=g.items[g.items.length-1].id, rng=(a===l?a:a+' ~ '+l);

        :'<div class="rghead"><span class="gp">'+catLabel(g.cat)+'</span><small>'+rng+'</small></div>';
      var body=open?'<div class="rgitems">'+g.items.map(function(x){
        return '<button class="gbtn rbtn'+(x.id===S.rsel?" on":"")+'" data-r="'+x.id+'" data-cat="'+esc(x.cat)+'" title="'+esc(x.tag)+'"><span class="rn">'+x.id+'</span><span class="rt"><b>'+esc(x.label)+'</b><span class="tg">'+esc(x.tag)+'</span></span></button>';}).join("")+'</div>':'';
      return '<div class="rgroup'+(f==="1"?' fold'+(open?' open':''):'')+'" style="--c1:'+c[0]+';--c2:'+c[1]+'">'+head+body+'</div>';}).join("")
      :'<div class="empty">조건에 맞는 반응이 없습니다.</div>';
    Array.prototype.forEach.call($("rgrid").querySelectorAll(".rbtn"),function(b){
      b.onclick=function(){S.rsel=b.getAttribute("data-r");
        if(f==="1") S.ocat=b.getAttribute("data-cat");
        if(f==="2"){S.rfold=true;pageReact();window.scrollTo(0,0);} else drawReact();};});
    Array.prototype.forEach.call($("rgrid").querySelectorAll(".fh"),function(b){
      b.onclick=function(){var c=b.getAttribute("data-cat"); S.ocat=(S.ocat===c)?"":c; drawReact();};});
  }

    d+='<div class="dhead"><span class="dtag">'+S.rsel+'</span><span class="dtag">'+esc(EE(it.cat))+'</span><h3 class="step">'+esc(card.header.split(/\s+·\s+/)[0].trim())+'</h3></div>';

    card.steps.forEach(function(s,i){
      var pt=s[0].indexOf("💡")===0;
      if(f==="4"){
        d+='<details class="fstep'+(pt?' pt':'')+'"'+(i===0?' open':'')+'><summary><span class="fl">'+esc(pt?E(s[0]):s[0])+'</span>'+chev(false)+'</summary><div class="fb">'+rich(s[1])+'</div></details>';
      } else if(s[0].indexOf("📌")===0) d+='<div class="ref"><b>'+esc(s[0])+'</b>'+refHtml(s[1])+'</div>';
      else if(pt) d+='<div class="callout warn" style="margin:12px 0"><b>'+esc(E(s[0]))+'</b>'+rich(s[1])+'</div>';
      else d+='<div class="box"><h4>'+esc(s[0])+'</h4>'+rich(s[1])+'</div>';});
  } else { d='<div class="empty">조건에 맞는 반응이 없습니다. 분류나 키워드를 바꿔 보세요.</div>'; $("rdetail").style.removeProperty("--mint"); $("rdetail").style.removeProperty("--mint-dk"); }
  $("rdetail").innerHTML=d;
  if($("fall")) $("fall").onclick=function(){
    var ds=$("rdetail").querySelectorAll("details.fstep"), anyClosed=false;

if(!window.__tipInit){window.__tipInit=1;document.addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest(".tipb"):null, all=document.querySelectorAll(".tipb.open");
  for(var i=0;i<all.length;i++){if(all[i]!==b)all[i].classList.remove("open");}
  if(b)b.classList.toggle("open");});}
function cellHtml(t){
  var out="", ul=false;
  function closeUl(){if(ul){out+="</ul>";ul=false;}}
  String(t).split("\n").forEach(function(raw){
    var l=EE(raw).trim(); if(!l) return;
    var rt=String(raw).trim();
    if(rt.indexOf("📢")===0){closeUl(); out+='<p class="chg-h">'+esc(rt)+'</p>'; return;}
    var cm=rt.match(/^▶\s*(변경 후|변경 전)\s*:\s*(.*)$/);
    if(cm){closeUl(); var aft=cm[1]==="변경 후"; out+='<p class="chg-l '+(aft?'aft':'bef')+'"><b>'+cm[1]+'</b><span>'+(aft?bold(esc(cm[2])):esc(cm[2]))+'</span></p>'; return;}
    var m=l.match(/^(스탠다드 (?:조건|유의사항)) \+$/);
    if(m){closeUl(); out+='<span class="pill">'+esc(m[1])+' + 추가</span>'; return;}
    if(/^→/.test(l)){closeUl(); out+='<p class="tip">'+esc(l)+'</p>'; return;}
    if(!ul){out+="<ul>";ul=true;}
    var sb=/^└/.test(l), note=/^(※|\*)/.test(l), txt=l.replace(/^[·•└]\s?/,""), none=(txt==="없음");
    var tip="", tm=txt.match(/\s*\(※ 예외 있음[^)]*\)\s*$/);
    if(tm && /양도양수/.test(txt)){txt=txt.slice(0,tm.index); tip='<button type="button" class="tipb" aria-label="양도양수 예외 보기">ⓘ 예외<span class="tipbox" role="tooltip"><b>양도양수 예외 (시스템 자동 적용)</b>'+esc(TIP_TRANSFER)+'</span></button>';}
    out+='<li'+(sb?' class="sub"':note?' class="note"':none?' class="none"':tip?' class="hastip"':'')+'>'+(sb?emph(esc(txt)):note||none?esc(txt):bold(esc(txt)))+tip+'</li>';
  });
  closeUl(); return out;
}
function pagePack(){
  var p=D.pack, std=p.header[1], prm=p.header[2];
  var h='<h2 class="title">'+esc(E(p.title))+'</h2>';
  if(p.meta) h+='<div class="meta">'+esc(EE(p.meta))+'</div>';
  h+='<div class="picker"><div class="plabel">보기 방식 선택</div><div class="seg" id="seg">'+
     '<button class="gbtn s-cmp'+(S.plan==="cmp"?" on":"")+'" data-p="cmp">나란히 비교</button>'+
     '<button class="gbtn s-std'+(S.plan==="std"?" on":"")+'" data-p="std">'+esc(std)+'</button>'+
     '<button class="gbtn s-prm'+(S.plan==="prm"?" on":"")+'" data-p="prm">'+esc(prm)+'</button></div></div>';
  h+='<div class="link"><i></i></div>';
  var cls=S.plan==="std"?"std":(S.plan==="prm"?"prm":"");
  h+='<section class="detail '+cls+(S.plan==="cmp"?"":" one")+'">';
  if(S.plan==="cmp"){
    h+='<div class="cmp-head"><div class="h-k">구분</div><div class="h-std">'+esc(std)+'</div><div class="h-prm">'+esc(prm)+'</div></div>';
    p.rows.forEach(function(r){
      var same=r[2].trim()==="스탠다드와 동일", chg=(r[1]+r[2]).indexOf("📢")>=0;
      h+='<div class="prow'+(chg?' chg':'')+'"><div class="k"><span class="ic">'+iconFor(r[0])+'</span>'+(chg?labelHtml(r[0]):'<span>'+esc(one(r[0]))+'</span>')+'</div>';
      var c1=r[1].indexOf("📢")>=0?" chg":"", c2=r[2].indexOf("📢")>=0?" chg":"";
      if(same) h+='<div class="cell both'+c1+'"><span class="pill same">'+esc(std)+' · '+esc(prm)+' 동일</span>'+cellHtml(r[1])+'</div>';
      else h+='<div class="cell std'+c1+'" data-l="'+esc(std)+'">'+cellHtml(r[1])+'</div><div class="cell prm'+c2+'" data-l="'+esc(prm)+'">'+cellHtml(r[2])+'</div>';
      h+='</div>';});
  } else {
    var isP=S.plan==="prm";
    h+='<div class="dhead"><span class="dtag" style="'+(isP?'color:var(--prm);background:var(--prm-bg);border-color:var(--prm-bd)':'')+'">'+esc(isP?prm:std)+'</span><h3 class="step">'+esc(isP?prm:std)+' 정리</h3></div>';
    p.rows.forEach(function(r){
      var same=r[2].trim()==="스탠다드와 동일", txt=isP?(same?r[1]:r[2]):r[1], chg=txt.indexOf("📢")>=0;
      h+='<div class="prow'+(chg?' chg':'')+'"><div class="k"><span class="ic">'+iconFor(r[0])+'</span>'+(chg?labelHtml(r[0]):'<span>'+esc(one(r[0]))+'</span>')+'</div>'+
         '<div class="cell wide '+(isP?"prm":"std")+(chg?" chg":"")+'">'+(isP&&same?'<span class="pill same">'+esc(std)+'와 동일</span>':'')+cellHtml(txt)+'</div></div>';});
  }
  h+='</section>';
  $("main").innerHTML=h;
  Array.prototype.forEach.call($("seg").querySelectorAll(".gbtn"),function(b){
    b.onclick=function(){S.plan=b.getAttribute("data-p");pagePack();};});
}

/* ───── 배민1플러스 불가지역 ───── */
function regGroups(){
  if(RG) return RG;
  var by={}; D.region.rows.forEach(function(r){var a=by[r[0]]||(by[r[0]]={}), b=a[r[1]]||(a[r[1]]=[]); b.push(r[2]);});
  var ko=function(x,y){return x.localeCompare(y,"ko");};
  var keys=Object.keys(by).sort(function(x,y){var i=REG_ORDER.indexOf(x),j=REG_ORDER.indexOf(y);i=i<0?99:i;j=j<0?99:j;return (i-j)||ko(x,y);});
  RG=keys.map(function(k){var n=0, sub=Object.keys(by[k]).sort(ko).map(function(sg){var l=by[k][sg].slice().sort(ko);n+=l.length;return {name:sg,items:l};});return {name:k,count:n,sub:sub};});
  return RG;
}
function hl(t,q){t=String(t); var j=q?t.indexOf(q):-1; if(j<0) return esc(t);
  return esc(t.slice(0,j))+"<mark>"+esc(t.slice(j,j+q.length))+"</mark>"+esc(t.slice(j+q.length));}
var MAPSD=null;
function sdCounts(){var c={}; D.region.rows.forEach(function(r){c[r[0]]=(c[r[0]]||0)+1;}); return c;}
function sdGroup(sd){return regGroups().filter(function(g){return g.name===sd;})[0];}
function chipsHtml(items,q){return '<div class="chips">'+items.map(function(n){return '<span class="chip">'+hl(n,q)+'</span>';}).join("")+'</div>';}
var LABOFF={"경기":[10,30],"충남":[-10,0],"서울":[0,0],"인천":[-14,2],"세종":[6,-2],"대전":[6,8],"광주":[0,-6],"전남":[0,10],"부산":[4,10],"울산":[2,0],"대구":[0,0]};
function mapHtml(){
  var M=D.map, cnt=sdCounts(), mx=0, by={};
  Object.keys(cnt).forEach(function(k){mx=Math.max(mx,cnt[k]);});
  M.regions.forEach(function(r){(by[r.sd]=by[r.sd]||[]).push(r.d);});
  MAPSD=by;
  var h='<svg class="kmap" viewBox="0 0 '+M.w+' '+M.h+'" role="img" aria-label="대한민국 시도별 배민1플러스 불가지역 지도"><g class="mbase">';
  REG_ORDER.forEach(function(sd){
    if(!by[sd]) return;
    var n=cnt[sd]||0, a=n?(0.2+0.75*n/mx):0;
    h+='<g class="sdg'+(n?'':' z')+'" data-sd="'+esc(sd)+'" style="'+(n?'--a:'+a.toFixed(2)+';--p:'+Math.round(a*100)+'%':'')+'"><path class="mp" d="'+by[sd].join("")+'"/></g>';});
  h+='</g><g id="munder"></g><g class="mlab">'+M.labels.map(function(l){var o=LABOFF[l.t]||[0,0]; return '<text x="'+(l.x+o[0])+'" y="'+(l.y+o[1])+'">'+esc(l.t)+'</text>';}).join("")+'</g>'+'</svg>';
  return h;
}
function sdTipHtml(sd){
  var g=sdGroup(sd);
  if(!g) return '<b>'+esc(sd)+'</b><span class="tz">불가지역 없음</span>';
  return '<div class="th"><b>'+esc(sd)+'</b><span>불가 '+g.count+'곳</span></div><div class="tg">'+
    g.sub.map(function(x){return '<span>'+esc(x.name)+'<em>'+x.items.length+'</em></span>';}).join("")+'</div><div class="tf">누르면 읍·면·동까지 볼 수 있어요</div>';
}
function legendHtml(){return '<div class="mleg"><span>불가 적음</span><i class="grad"></i><span>불가 많음</span></div>';}
function setHot(sd){
  Array.prototype.forEach.call(document.querySelectorAll(".sdg.hot"),function(g){g.classList.remove("hot");});
  if(!sd) return; Array.prototype.forEach.call(document.querySelectorAll('.sdg[data-sd="'+sd+'"]'),function(g){g.classList.add("hot");});
}
function pageRegion(){
  var R=D.region, total=R.rows.length;
  var h='<h2 class="title">'+esc(E(R.title))+'</h2>';
  h+='<div class="meta">'+esc(R.meta)+' · 총 '+total.toLocaleString("ko-KR")+'개 읍·면·동 (모두 배민1플러스 불가)</div>';
  h+='<div class="rg-note"><p>지도에서 시·도에 마우스를 올리면 불가지역이 바로 보여요. 누르면 읍·면·동까지, 검색하면 동네별로 확인할 수 있어요. 목록에 있는 곳은 모두 <b>배민1플러스 불가</b> 지역입니다.</p>'+
     '<p>※ 배민배달(배민1플러스)이 불가한 지역은 배민배달이 필수인 스타터팩도 가입할 수 없어요. 목록에 없는 동네는 표기가 다를 수 있으니 시·군·구까지 함께 검색해 보세요.</p></div>';
  h+='<div class="rg-bar"><input class="search" id="rgq" placeholder="예: 대산읍, 예산군, 철원" autocomplete="off" value="'+esc(S.rgq)+'"></div>';
  h+='<div class="rgwrap"><div class="mapbox" id="mapbox">'+mapHtml()+'<div class="mtip" id="mtip"></div>'+legendHtml()+
     '<div class="msrc">지도 : 통계청(KOSTAT) 2018 행정구역 경계 기준 · 색이 진할수록 불가 읍·면·동이 많은 시·도</div></div>'+
     '<div class="rgpanel" id="rgpanel"></div></div>';
  $("main").innerHTML=h;
  $("rgq").addEventListener("input",function(){S.rgq=this.value;if(S.rgq.trim())S.rgsel="";drawRegion();});
  var box=$("mapbox"), tip=$("mtip");
  function sdOf(e){var t=e.target.closest?e.target.closest(".sdg"):null; return t?t.getAttribute("data-sd"):"";}
  box.addEventListener("mousemove",function(e){
    var sd=sdOf(e);
    if(!sd){tip.style.display="none";return;}
    if(tip.getAttribute("data-sd")!==sd){tip.innerHTML=sdTipHtml(sd);tip.setAttribute("data-sd",sd);}
    tip.style.display="block";
    var bb=box.getBoundingClientRect(), x=e.clientX-bb.left, y=e.clientY-bb.top, w=tip.offsetWidth, hh=tip.offsetHeight;
    var left=x+16; if(left+w>bb.width-6) left=x-w-16; if(left<6) left=6;
    var top=y-14; if(top+hh>bb.height-6) top=bb.height-hh-6; if(top<6) top=6;
    tip.style.left=left+"px"; tip.style.top=top+"px";});
  box.addEventListener("mouseleave",function(){tip.style.display="none";});
  box.addEventListener("click",function(e){
    var sd=sdOf(e); if(!sd) return;
    S.rgq=""; $("rgq").value=""; if(!document.querySelector("#rgpanel .sditem")) drawRegion(); selectSd(sd,true);});
  drawRegion();
}
function markSel(sd){Array.prototype.forEach.call(document.querySelectorAll(".sdg"),function(g){g.classList.toggle("sel",!!sd&&g.getAttribute("data-sd")===sd);});}
function selectSd(sd,scroll){
  S.rgsel=sd; markSel(sd);
  var cb=$("rgclr"); if(cb) cb.hidden=!sd;
  var its=document.querySelectorAll("#rgpanel .sditem"), target=null;
  Array.prototype.forEach.call(its,function(it){
    var on=it.getAttribute("data-sd")===sd;
    it.classList.toggle("on",on); it.querySelector(".sdrow").classList.toggle("on",on);
    it.querySelector(".sdrow").setAttribute("aria-expanded",on); it.querySelector(".sddet").hidden=!on;
    if(on) target=it;});
  $("munder").innerHTML=underHtml([],sd);
  if(scroll&&target&&target.scrollIntoView&&!(window.matchMedia&&window.matchMedia("(max-width:860px)").matches)){try{target.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(e){target.scrollIntoView();}}
}
function underHtml(hitSd,selSd){
  var O=D.map.outlines||{}, h="";
  function one(sd,cls){return '<path class="ol bg" d="'+O[sd]+'"/><path class="ol '+cls+'" d="'+O[sd]+'"/>';}
  hitSd.forEach(function(sd){if(O[sd]) h+=one(sd,"hit");});
  if(selSd&&MAPSD&&MAPSD[selSd]) h+='<path class="fl sel" d="'+MAPSD[selSd].join("")+'"/>';
  return h;
}
function drawRegion(){
  var raw=S.rgq.trim(), q=raw.replace(/\s+/g,""), out="", panel=$("rgpanel");
  setHot(""); markSel("");
  if(q){
    var hits=D.region.rows.filter(function(r){return (r[0]+r[1]+r[2]).replace(/\s+/g,"").indexOf(q)>=0;});
    if(!hits.length){
      panel.innerHTML='<div class="rg-hit none">‘'+esc(raw)+'’은(는) 불가지역 목록에 없어요.<small>이름 표기가 다를 수 있으니 시·군·구 이름이나 일부만 다시 검색해 보세요.</small></div>';
      $("munder").innerHTML=""; return;}
    var CAP=300, shown=hits.slice(0,CAP), by={}, hitSd=[];
    hits.forEach(function(r){if(hitSd.indexOf(r[0])<0) hitSd.push(r[0]);});
    shown.forEach(function(r){var a=by[r[0]]||(by[r[0]]={}), b=a[r[1]]||(a[r[1]]=[]); b.push(r[2]);});
    var keys=Object.keys(by).sort(function(x,y){var i=REG_ORDER.indexOf(x),j=REG_ORDER.indexOf(y);i=i<0?99:i;j=j<0?99:j;return (i-j)||x.localeCompare(y,"ko");});
    out='<div class="rg-hit bad">🚫 ‘'+esc(raw)+'’ 검색 결과 '+hits.length+'건 · 모두 배민1플러스 불가'+
        (hits.length>CAP?'<small>검색 결과가 많아 앞의 '+CAP+'건만 보여드려요. 검색어를 더 구체적으로 입력해 주세요.</small>':'')+'</div>';
    out+=keys.map(function(k){
      var n=0, body=Object.keys(by[k]).sort(function(x,y){return x.localeCompare(y,"ko");}).map(function(sg){
        var l=by[k][sg].slice().sort(function(x,y){return x.localeCompare(y,"ko");}); n+=l.length;
        return '<div class="rgs"><div class="rgsn">'+hl(sg,q)+'<small>'+l.length+'곳</small></div>'+chipsHtml(l,q)+'</div>';}).join("");
      return '<details class="rgd" open><summary>'+hl(k,q)+'<span class="cnt">'+n+'곳</span></summary><div class="rgbody">'+body+'</div></details>';}).join("");
    panel.innerHTML=out; $("munder").innerHTML=underHtml(hitSd,""); return;
  }
  var cnt=sdCounts(), mx=0; Object.keys(cnt).forEach(function(k){mx=Math.max(mx,cnt[k]);});
  out='<div class="rgsel-h" id="rghead"><b>시·도별 한눈에 보기</b><button type="button" class="gbtn rgclr" id="rgclr" title="접기" aria-label="접기"'+(S.rgsel?'':' hidden')+'><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></div><p class="rgsum">총 <b>'+D.region.rows.length.toLocaleString("ko-KR")+'곳</b> · 시·도를 누르면 아래로 읍·면·동 목록이 펼쳐지고, 지도에서 해당 지역이 깜빡여요.</p><div class="sdlist">'+
    regGroups().slice().sort(function(a,b){return b.count-a.count;}).map(function(g){
      var on=(S.rgsel===g.name);
      return '<div class="sditem'+(on?' on':'')+'" data-sd="'+esc(g.name)+'"><button type="button" class="sdrow'+(on?' on':'')+'" aria-expanded="'+on+'"><span class="sn">'+esc(g.name)+'</span><span class="bar"><i style="width:'+Math.max(4,Math.round(g.count/mx*100))+'%"></i></span><b>'+g.count+'곳</b><span class="car"></span></button>'+
        '<div class="sddet"'+(on?'':' hidden')+'>'+g.sub.map(function(sg){return '<div class="rgs"><div class="rgsn">'+esc(sg.name)+'<small>'+sg.items.length+'곳</small></div>'+chipsHtml(sg.items,"")+'</div>';}).join("")+'</div></div>';}).join("")+'</div>';
  panel.innerHTML=out; $("munder").innerHTML=underHtml([],S.rgsel); markSel(S.rgsel);
  $("rgclr").onclick=function(){selectSd("",false);panel.scrollTop=0;};
  Array.prototype.forEach.call(panel.querySelectorAll(".sditem"),function(it){
    var sd=it.getAttribute("data-sd"), row=it.querySelector(".sdrow");
    row.onmouseenter=function(){setHot(sd);}; row.onmouseleave=function(){setHot("");};
    row.onclick=function(){selectSd(S.rgsel===sd?"":sd,true);};});
}

function render(){
  renderNav();
  if(S.page==="region") pageRegion(); else if(S.page==="react") pageReact(); else if(S.page==="pack") pagePack(); else pageFlow();
}
["agency","manager","phone"].forEach(function(id){
  $(id).addEventListener("input",function(){
    if(S.page==="flow") pageFlow(); else if(S.page==="react") drawReact();});
});
var hp=(location.hash||"").replace("#","");
if(hp==="region"||PAGES.some(function(p){return p[0]===hp;})){S.page=hp;if(hp==="flow"||hp==="react")S.lastScript=hp;}
initTheme();
render();
})();
</script>
